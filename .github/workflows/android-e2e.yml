name: android-e2e
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *'
permissions:
  contents: read
# A newer push to the same PR cancels the superseded run; main pushes,
# nightly and manual runs are never cancelled.
concurrency:
  group: android-e2e-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  # Skips the emulator job only when every changed file is on the
  # docs-only allowlist in tools/ci/android-e2e-scope.mjs; anything else,
  # an unknown change set, nightly and manual runs keep the full job.
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      run: ${{ steps.scope.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            pull_request) node tools/ci/android-e2e-scope.mjs "$PR_BASE" "$PR_HEAD" ;;
            push) node tools/ci/android-e2e-scope.mjs "$PUSH_BEFORE" "$PUSH_AFTER" ;;
            *) echo 'run=true' >> "$GITHUB_OUTPUT" ;;
          esac
  smoke-and-walk:
    needs: scope
    if: needs.scope.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: install (root)
        run: npm ci
      - name: install Android SDK and AVD
        run: |
          set -euo pipefail
          export ANDROID_USER_HOME="$RUNNER_TEMP/kudy-android"
          export ANDROID_AVD_HOME="$ANDROID_USER_HOME/avd"
          printf 'ANDROID_USER_HOME=%s\nANDROID_AVD_HOME=%s\n' \
            "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_AVD_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-36' 'build-tools;36.0.0' 'platform-tools' \
            'emulator' 'system-images;android-36;google_apis;x86_64'
          echo no | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd \
            --name kudy-ci --device pixel_5 --package 'system-images;android-36;google_apis;x86_64' \
            --path "$ANDROID_AVD_HOME/kudy-ci.avd" --force
          test -f "$ANDROID_AVD_HOME/kudy-ci.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fxq kudy-ci
      - name: build debug APK
        run: |
          set -euo pipefail
          mkdir -p android-e2e-logs
          npx expo prebuild --platform android --no-install 2>&1 | tee android-e2e-logs/prebuild.log
          (cd android && ./gradlew assembleDebug --no-daemon --console=plain) 2>&1 | tee android-e2e-logs/gradle.log
          test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: boot emulator and run smoke, walk and discovery
        run: |
          set -euo pipefail
          emulator_args=()
          if test -e /dev/kvm; then
            sudo chmod 666 /dev/kvm
            echo 'KVM available'
          else
            echo 'KVM unavailable; emulator will use software acceleration'
            emulator_args+=(-accel off)
          fi
          "$ANDROID_HOME/emulator/emulator" -avd kudy-ci -no-window -no-audio \
            -no-snapshot -gpu swiftshader_indirect -memory 2048 "${emulator_args[@]}" \
            > android-e2e-logs/emulator.log 2>&1 &
          booted=0
          for attempt in $(seq 1 120); do
            if [[ "$("$ANDROID_HOME/platform-tools/adb" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == 1 ]]; then
              booted=1
              break
            fi
            sleep 5
          done
          test "$booted" -eq 1
          export KUDY_ADB="$ANDROID_HOME/platform-tools/adb"
          for suite in smoke walk discovery; do
            npm run e2e:android -- --suite "$suite" 2>&1 | tee "android-e2e-logs/$suite.log"
            if grep -q '^SKIP e2e:android' "android-e2e-logs/$suite.log"; then
              echo "Android $suite suite skipped in CI" >&2
              exit 1
            fi
          done
      # DQ-10: the pixel gate is not a merge gate until the runs show fewer
      # than 1 false failure in 20 (spec §8.1) — the step records the verdict
      # and always uploads the report and diffs, but never fails the job.
      - name: run visual:check (non-gating report)
        if: always()
        run: |
          set -o pipefail
          visual_status=0
          npm run visual:check -- --out visual-check-report 2>&1 | tee android-e2e-logs/visual-check.log || visual_status=$?
          echo "visual:check exit status: $visual_status (0 = clean verdict; non-zero = DIFF/FAIL/RULE or FAILED TO RUN — non-gating until stable, the report and diffs are uploaded as an artifact)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: visual-check-report
          path: visual-check-report/
          if-no-files-found: warn
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: android-e2e-failure
          path: |
            android-e2e-logs/
            tools/e2e-android/artifacts/
          if-no-files-found: warn
