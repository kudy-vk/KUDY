name: jscpd
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  jscpd:
    # Self-contained jscpd gate. A cross-repo reusable workflow is not used:
    # GitHub rejects reusable-workflow calls between private user-account
    # repositories at startup with zero jobs, so the gate would silently never
    # run. Guarded in tools/ci/check-required-checks.mjs.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"
      - name: Detect duplicated code
        shell: bash
        env:
          INPUT_PATH: "."
        run: |
          set -euo pipefail

          DEFAULT_CONFIG=$(mktemp /tmp/default-jscpd.XXXXXX.json)
          # Fallback jscpd config, base64-embedded, used only when the repository
          # has no .jscpd.json. Regenerate with base64 -w0 on the source file.
          echo '' | base64 -d > "$DEFAULT_CONFIG"

          SCAN_PATH="${INPUT_PATH:-.}"
          CONFIG=""
          if [[ -f .jscpd.json ]]; then
            CONFIG=".jscpd.json"
          fi
          if [[ ! -f "$CONFIG" ]]; then
            CONFIG="$DEFAULT_CONFIG"
          fi

          cmd=(npx --yes jscpd@5.1.2 --config "$CONFIG" --no-tips)
          read -r -a paths <<< "$SCAN_PATH"
          cmd+=("${paths[@]}")

          printf '+'
          printf ' %q' "${cmd[@]}"
          printf '\n'
          exec "${cmd[@]}"
