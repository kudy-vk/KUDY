<!doctype html>
<html lang="be">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KUDY — прэв'ю гіда</title>
<link rel="stylesheet" href="kit.css">
<style>
  .pv-scroll { padding: 0 16px 16px; }
  .pv-title { margin: 4px 0 8px; font-size: calc(28px * var(--fs)); font-weight: 400; overflow-wrap: anywhere; }
  .pv-tags { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin: 0 0 12px; }
  .pv-summary { margin: 0 0 12px; }

  /* Facts and languages: an icon beside each line; the line itself stays text. */
  .pv-facts { display: flex; flex-wrap: wrap; gap: 8px 16px; margin: 0 0 12px; padding: 0; list-style: none; }
  .pv-facts li, .pv-lang { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .pv-lang { flex-wrap: wrap; margin: 0 0 8px; }
  .pv-facts .icon, .pv-lang .icon, .pv-stops .icon { color: var(--muted); }

  .pv-h { margin: 16px 0 8px; font-size: calc(16px * var(--fs)); font-weight: 600; }
  .pv-stops { margin: 0; padding: 0 12px; list-style: none; }
  .pv-stops li { display: flex; gap: 12px; padding: 12px 0; }
  .pv-stops li + li { border-top: 1px solid var(--line); }
  .pv-stops li > .icon { margin-top: 2px; }
  .pv-stops p { margin: 0; overflow-wrap: anywhere; }
  .pv-stops p.pv-announce { margin-top: 4px; }
  .pv-stops .tag { margin-top: 8px; }

  .pv-notice { margin: 4px 0 12px; }
  .pv-notice p { margin: 0; }
  .pv-notice p + p { margin-top: 4px; }
  .pv-notice .t-strong { display: flex; align-items: flex-start; gap: 8px; }
  .pv-notice .t-strong .icon { margin-top: .2em; }
  .pv-notice .btn { margin-top: 12px; }

  /* The purchase offer is a separate, quiet card: buying is its own action. */
  .pv-offer { margin-top: 16px; }
  .pv-offer h3 { margin: 0; font-size: inherit; }
  .pv-offer p { margin: 8px 0 12px; color: var(--muted); }
  .pv-quiet { display: block; width: 100%; min-height: 48px; margin-top: 4px; border: 0; background: none; color: var(--muted); cursor: pointer; }

  /* The one main button stays in reach under the scrolling description;
     the reason for an unavailable button is written right under it. */
  .pv-foot { flex: none; padding: 12px 16px; border-top: 1px solid var(--line); }
  .pv-foot p { margin: 8px 0 0; }
  .pv-progress { margin-top: 8px; }
  .pv-progress i { width: 40%; border-radius: 99px; animation: pv-run 1.2s ease-in-out infinite alternate; }
  @keyframes pv-run { from { translate: 0; } to { translate: 150%; } }
  @media (prefers-reduced-motion: reduce) { .pv-progress i { animation: none; } }

  .sr { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<main class="board">
  <h1>Прэв'ю гіда</h1>
  <p class="lead">Апісанне гіда з адной галоўнай кнопкай: спачатку «Загрузіць», пасля загрузкі і праверкі — «Пачаць». Усё ў рамцы тэлефона — сам экран; перамыкачы над ім да экрана не належаць.</p>
</main>
<script type="module" src="preview.mjs"></script>
</body>
</html>
