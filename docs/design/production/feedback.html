<!doctype html>
<html lang="be">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KUDY — форма ацэнкі</title>
<link rel="stylesheet" href="kit.css">
<style>
  /* The form scrolls; Send and Skip stay at the bottom, under the thumb. */
  .fb-scroll { padding: 0 16px 16px; }
  .fb-scroll > * + * { margin-top: 20px; }
  .fb-target { display: grid; justify-items: start; gap: 6px; }
  .fb-target .name { font-size: calc(20px * var(--fs)); overflow-wrap: anywhere; }
  .fb-target .name:not(.t-display) { font-weight: 600; }
  .fb-question { margin: 8px 0 0; font-size: calc(24px * var(--fs)); font-weight: 600; line-height: 1.2; text-wrap: balance; }
  .fb-target .t-small { margin: 0; }

  .fb-conflict { display: flex; gap: 8px; font-size: calc(15px * var(--fs)); }
  .fb-conflict > .icon { margin-top: 2px; color: var(--warn); }
  .fb-conflict > div { display: grid; justify-items: start; gap: 10px; }

  /* Five stars, no digits: each star is a 52px button (touch area over 44px). */
  .fb-stars { display: flex; justify-content: center; gap: 4px; }
  .fb-star {
    flex: none;
    display: grid;
    place-items: center;
    width: 52px;
    height: 52px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: none;
    color: var(--muted);
    cursor: pointer;
  }
  .fb-star.on { color: var(--accent); }
  .fb-star.on .icon { fill: currentColor; }
  .fb-star[aria-disabled="true"] { color: var(--disabled-ink); cursor: default; }
  .fb-ends { display: flex; justify-content: space-between; gap: 16px; margin-top: 4px; }
  .fb-ends span { flex: 1; }
  .fb-ends span:last-child { text-align: right; }

  .fb-section { margin: 0 0 8px; font-size: calc(15px * var(--fs)); font-weight: 600; }
  .fb-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .fb-chips .chip { min-height: 44px; text-align: left; }
  .fb-chips .chip[aria-disabled="true"] { border-color: var(--disabled-line); background: transparent; color: var(--disabled-ink); cursor: default; }
  /* A chosen reason stays recognisable while the form is sending: a check mark, not colour alone. */
  .fb-chips .chip[aria-pressed="true"] .icon { margin-left: -4px; }
  .fb-note p { margin: 0; }
  .fb-note p + p { margin-top: 6px; }

  .fb-foot { flex: none; display: flex; align-items: center; gap: 12px; min-height: 80px; padding: 12px 16px; border-top: 1px solid var(--line); }
  .fb-reason { flex: 1; min-width: 0; margin: 0; font-size: calc(13px * var(--fs)); color: var(--muted); }
  .fb-hint { position: absolute; z-index: 4; top: calc(var(--status) + 52px); right: 12px; left: 48px; box-shadow: 0 8px 24px rgb(34 38 43 / 22%); }
  .fb-hint p { margin: 0; }
  .fb-hint p + p { margin-top: 6px; }
  .fb-review { font-family: inherit; display: block; width: 100%; padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); color: var(--ink); font-size: calc(16px * var(--fs)); resize: none; caret-color: var(--accent); }
  .fb-review::placeholder { color: var(--muted); }
  .fb-write-note { display: flex; justify-content: space-between; gap: 12px; margin: 6px 0 0; }
</style>
</head>
<body>
<main class="board">
  <h1>Форма ацэнкі</h1>
  <p class="lead">Фінальны макет часовай паверхні: ацаніць гід або месца пяццю зоркамі, пры жаданні назваць да трох прычын. Форму можна прапусціць, яна нічога не блакуе. Назва гіда і месца — ілюстрацыйныя.</p>
</main>
<script type="module" src="feedback.mjs"></script>
</body>
</html>
