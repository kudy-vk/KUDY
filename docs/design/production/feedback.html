<!doctype html>
<html lang="be">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KUDY — форма ацэнкі</title>
<link rel="stylesheet" href="kit.css">
<style>
  /* The same paper, framed surfaces and medallion language as the approved menu/about screens. */
  .fb-scroll { padding: 8px 16px 24px; }
  .fb-scroll > * + * { margin-top: 16px; }
  .fb-target { display: grid; gap: 12px; }
  .fb-target-head { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .fb-target-copy { display: grid; justify-items: start; gap: 4px; min-width: 0; }
  .fb-mark {
    flex: none; display: grid; place-items: center; position: relative;
    width: 52px; height: 52px; border: 2px solid var(--medal-rim);
    border-radius: 50% 49% 51% 48%; background: var(--medal-paper);
    color: var(--medal-ink); box-shadow: 0 2px 0 var(--shelf-line);
  }
  .fb-mark::after { content: ""; position: absolute; inset: 3px; border: 1px solid var(--medal-rim); border-radius: inherit; opacity: .45; }
  [data-theme="dark"] .fb-mark { background: var(--card); color: var(--ink); }
  .fb-target .name { font-size: calc(22px * var(--fs)); line-height: 1.2; overflow-wrap: anywhere; }
  .fb-target .name:not(.t-display) { font-weight: 600; }
  .fb-question { margin: 2px 0 0; font-size: calc(22px * var(--fs)); font-weight: 600; line-height: 1.2; text-wrap: balance; }
  .fb-target .t-small { margin: -4px 0 0; }
  .fb-score-card { padding: 14px 12px 12px; box-shadow: 0 2px 0 var(--shelf-line); }

  .fb-conflict { display: flex; gap: 8px; font-size: calc(15px * var(--fs)); }
  .fb-conflict > .icon { margin-top: 2px; color: var(--warn); }
  .fb-conflict > div { display: grid; justify-items: start; gap: 10px; }

  /* Five stars, no digits: each star is a 52px button (touch area over 44px). */
  .fb-stars { display: flex; justify-content: center; gap: 4px; }
  .fb-star {
    flex: none;
    display: grid;
    place-items: center;
    width: clamp(44px, calc((var(--w) - 76px) / 5), 52px);
    height: 52px;
    padding: 0;
    border: 0;
    border-radius: 50%;
    background: none;
    color: var(--muted);
    cursor: pointer;
  }
  .fb-star.on { color: var(--accent); }
  .fb-star.on .icon { fill: currentColor; }
  .fb-star[aria-disabled="true"] { color: var(--disabled-ink); cursor: default; }
  .fb-ends { display: flex; justify-content: space-between; gap: 16px; margin-top: 4px; }
  .fb-ends span { flex: 1; }
  .fb-ends span:last-child { text-align: right; }

  .fb-section { margin: 0 0 8px; font-size: calc(15px * var(--fs)); font-weight: 600; }
  .fb-chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .fb-chips .chip { min-height: 44px; text-align: left; gap: 8px; }
  .fb-chips .chip[aria-disabled="true"] { border-color: var(--disabled-line); background: transparent; color: var(--disabled-ink); cursor: default; }
  /* Reserve the mark for every state so toggling a reason never changes chip width or wrapping. */
  .fb-chip-mark { flex: none; display: grid; place-items: center; width: 18px; height: 18px; border: 1px solid var(--line); border-radius: 50%; }
  .fb-chip-mark .icon { visibility: hidden; }
  .fb-chips .chip[aria-pressed="true"] .fb-chip-mark { border-color: currentColor; }
  .fb-chips .chip[aria-pressed="true"] .fb-chip-mark .icon { visibility: visible; }

  .fb-foot { flex: none; display: flex; align-items: center; gap: 12px; min-height: 80px; padding: 12px 16px; border-top: 1px solid var(--line); }
  .fb-reason { flex: 1; min-width: 0; margin: 0; font-size: calc(13px * var(--fs)); color: var(--muted); }
  .fb-hint { position: absolute; z-index: 4; top: calc(var(--status) + 52px); right: 12px; left: 48px; box-shadow: 0 8px 24px rgb(34 38 43 / 22%); }
  .fb-hint p { margin: 0; }
  .fb-hint p + p { margin-top: 6px; }

</style>
</head>
<body>
<main class="board">
  <h1>Форма ацэнкі</h1>
  <p class="lead">Працоўны макет часовай паверхні для першага рэлізу: ацаніць гід або месца пяццю зоркамі, пры жаданні назваць да трох прычын. Форму можна прапусціць, яна нічога не блакуе. Назва гіда і месца — ілюстрацыйныя. Вольны тэкст у першым рэлізе не збіраецца (рашэнне #207).</p>
</main>
<script type="module" src="feedback.mjs"></script>
</body>
</html>
