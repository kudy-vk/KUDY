<!doctype html>
<html lang="be">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KUDY — галоўны экран</title>
<link rel="stylesheet" href="kit.css">
<style>
  /* The block with the map pieces ends at 5/8 of the screen height (decision M1). */
  .menu-top {
    flex: none;
    display: flex;
    flex-direction: column;
    height: calc(var(--h) * 5 / 8 - var(--status));
  }
  .menu-head {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 48px;
    padding: 0 16px;
  }
  .brand { font-size: calc(22px * var(--fs)); font-weight: 600; letter-spacing: -0.02em; color: var(--accent); }
  .city { margin-left: auto; font-size: calc(13px * var(--fs)); color: var(--muted); }
  .walk { flex: none; display: grid; place-items: center; width: 48px; height: 48px; margin-right: -4px; padding: 0; border: 0; background: none; cursor: pointer; }
  .walk span { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); }
  .menu-title {
    position: relative;
    z-index: 1;
    margin: 8px 16px 0;
    font: calc(32px * var(--fs)) / 1.1 Alegreya, serif;
    text-wrap: balance;
  }
  .menu-canvas { position: relative; flex: 1; min-height: 0; }
  .menu-canvas svg { display: block; width: 100%; height: 100%; overflow: visible; touch-action: none; user-select: none; -webkit-user-select: none; }
  .ad-zone { position: relative; z-index: 1; }
  .menu-rest { flex: 1; }

  .piece { outline: none; cursor: pointer; }
  .piece .art { transition: opacity 120ms ease-out, transform 160ms cubic-bezier(.2, .8, .2, 1); }
  .piece .ui-art { transition: opacity 160ms; }
  .piece.grouped .ui-art { opacity: 0; }
  .piece[data-touch="pressed"] .art { opacity: .86; }
  .piece[data-touch="held"] .art { transform: translateY(-10px); }
  .piece[data-touch="held"] .art,
  .piece[data-touch="dragging"] .art { filter: drop-shadow(0 20px 15px rgb(69 50 25 / 19%)); }
  .complete .piece .art { transform: none; }
  .piece .ring { fill: none; stroke: #1d6b4f; opacity: 0; }
  .piece:focus-visible .ring,
  .piece.near .ring { opacity: 1; }
  .piece.near .ring { stroke: #bd852c; }
  .settling .piece { transition: transform 380ms cubic-bezier(.2, .8, .2, 1); }

  /* Badges sit on the light map art, so they keep the light tokens in both themes (DT-4). */
  .badge { filter: drop-shadow(0 2px 3px rgb(34 38 43 / 22%)); }
  .badge rect { fill: #ffffff; stroke: #d8d2c6; }
  .badge .glyph { fill: none; stroke: #1d6b4f; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .badge text { fill: #1d6b4f; font-family: "Golos Text", system-ui, sans-serif; dominant-baseline: central; }
  .badge.off rect { stroke: #6b7280; }
  .badge.off .glyph { stroke: #6b7280; }
  .badge.off text { fill: #6b7280; }

  .radiance, .energy-ring { opacity: 0; transform-box: fill-box; transform-origin: center; }
  .energy-ring { fill: none; stroke: #f8d580; stroke-width: 10; }
  .spark { stroke: #dba43d; stroke-width: 7; stroke-linecap: round; transform-box: fill-box; transform-origin: center; animation: glimmer 380ms ease-out forwards; }
  .ripple { fill: #f4d68a55; stroke: #bd852c; stroke-width: 6; transform-box: fill-box; transform-origin: center; animation: ripple 450ms ease-out forwards; }
  .scene-part image { pointer-events: none; }
  @keyframes glimmer { from { opacity: 1; scale: .6; } to { opacity: 0; scale: 1.6; } }
  @keyframes ripple { from { opacity: .9; transform: scale(.6); } to { opacity: 0; transform: scale(2.3); } }

  @media (prefers-reduced-motion: reduce) {
    .piece, .piece .art, .piece .ui-art { transition: none; }
    .spark, .ripple { animation: none; opacity: 0; }
  }
</style>
</head>
<body>
<main class="board">
  <h1>Галоўны экран</h1>
  <p class="lead">Фінальны макет. Усё ў рамцы тэлефона — сам экран; перамыкачы над ім да экрана не належаць. Націск адкрывае раздзел, утрыманне дазваляе рухаць частку.</p>
  <div class="controls">
    <label>Экран<select id="device"></select></label>
    <label>Мова<select id="locale"></select></label>
    <label>Тэкст<select id="scale"><option value="1">Звычайны</option><option value="1.5">Буйны ×1,5</option></select></label>
    <label>Подпісы<select id="labels"><option value="icons">Іконкі</option><option value="text">Іконкі з тэкстам</option></select></label>
    <label>Банер<select id="ad"><option value="loaded">Загрузіўся</option><option value="none">Не загрузіўся</option></select></label>
    <label>Прагулка<select id="walk"><option value="no">Не ідзе</option><option value="yes">Ідзе</option></select></label>
    <button type="button" id="again">Адкрыць экран нанова</button>
  </div>
  <p class="event" id="event" role="status"></p>
  <div class="phones" id="phones"></div>
</main>
<script type="module" src="menu.mjs"></script>
</body>
</html>
