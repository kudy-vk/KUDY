<!doctype html>
<html lang="be">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KUDY — галоўны экран</title>
<link rel="stylesheet" href="kit.css">
<style>
  /* The block with the map pieces ends at 5/8 of the screen height (decision M1). */
  .menu-top {
    flex: none;
    display: flex;
    flex-direction: column;
    height: calc(var(--h) * 5 / 8 - var(--status));
  }
  .menu-head {
    position: relative;
    z-index: 1;
    display: flex;
    align-items: center;
    gap: 8px;
    min-height: 48px;
    padding: 0 16px;
  }
  .menu-head .walkbtn { margin-right: -4px; }
  .brand { font-size: calc(22px * var(--fs)); font-weight: 600; letter-spacing: -0.02em; color: var(--accent); }
  .city { margin-left: auto; font-size: calc(13px * var(--fs)); color: var(--muted); }
  .menu-title { position: relative; z-index: 1; margin: 8px 16px 0; font-size: calc(32px * var(--fs)); font-weight: 400; }
  .menu-canvas { position: relative; flex: 1; min-height: 0; }
  .menu-canvas svg { display: block; width: 100%; height: 100%; overflow: visible; touch-action: none; user-select: none; -webkit-user-select: none; }
  /* Free space under the ad; the engraved panorama rests on its bottom edge. */
  .menu-rest { flex: 1; min-height: 0; display: flex; align-items: flex-end; overflow: hidden; }

  .piece { outline: none; cursor: pointer; }
  .piece .art { transition: opacity 120ms ease-out, transform 160ms cubic-bezier(.2, .8, .2, 1); }
  .piece .ui-art { transition: opacity 160ms; }
  .piece.grouped .ui-art { opacity: 0; }
  .piece[data-touch="pressed"] .art { opacity: .86; }
  .piece[data-touch="held"] .art { transform: translateY(-10px); }
  .piece[data-touch="held"] .art,
  .piece[data-touch="dragging"] .art { filter: drop-shadow(0 20px 15px rgb(69 50 25 / 19%)); }
  .complete .piece .art { transform: none; }
  .piece .ring { fill: none; stroke: #1d6b4f; opacity: 0; }
  .piece:focus-visible .ring,
  .piece.near .ring { opacity: 1; }
  .piece.near .ring { stroke: #bd852c; }
  .settling .piece { transition: transform 380ms cubic-bezier(.2, .8, .2, 1); }

  /* A piece whose section is not open yet: paler art. A press gives it its colour
     back for a moment and does nothing else; it can still be moved. */
  .piece.off .tone { filter: saturate(.28) brightness(1.05); transition: filter 220ms ease-out; }
  .piece.off[data-touch="pressed"] .tone,
  .piece.off[data-touch="held"] .tone,
  .piece.off[data-touch="dragging"] .tone,
  .piece.off.lit .tone,
  .complete .piece.off .tone { filter: none; }
  .piece.off[data-touch="pressed"] .art { opacity: 1; }

  /* Medallions are drawn in the map's own language: cream paper, a sand-gold
     ring and brown ink, with a slightly uneven hand-drawn line. They sit on the
     light map art, so they look the same in both themes (DT-4). */
  .medal { filter: drop-shadow(0 1.5px 1.5px rgb(74 52 30 / 38%)); }
  .medal .disc { fill: var(--medal-paper); stroke: var(--medal-rim); stroke-width: 1.3; }
  .medal .inner { fill: none; stroke: var(--medal-rim); stroke-width: .7; opacity: .45; }
  .medal .glyph { fill: none; stroke: var(--medal-ink); stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
  .medal.off .disc { fill: #f3ead6; stroke: #a8957c; }
  .medal.off .inner { stroke: #a8957c; }
  .medal.off .glyph { stroke: #7d6c58; }

  .radiance, .energy-ring { opacity: 0; transform-box: fill-box; transform-origin: center; }
  .energy-ring { fill: none; stroke: var(--medal-glow); stroke-width: 10; }
  .spark { stroke: #dba43d; stroke-width: 7; stroke-linecap: round; transform-box: fill-box; transform-origin: center; animation: glimmer 380ms ease-out forwards; }
  .ripple { fill: #f4d68a55; stroke: var(--medal-rim); stroke-width: 6; transform-box: fill-box; transform-origin: center; animation: ripple 450ms ease-out forwards; }
  .scene-part image { pointer-events: none; }
  @keyframes glimmer { from { opacity: 1; scale: .6; } to { opacity: 0; scale: 1.6; } }
  @keyframes ripple { from { opacity: .9; transform: scale(.6); } to { opacity: 0; transform: scale(2.3); } }

  @media (prefers-reduced-motion: reduce) {
    .piece, .piece .art, .piece .ui-art, .piece.off .tone { transition: none; }
    .spark, .ripple { animation: none; opacity: 0; }
  }
</style>
</head>
<body>
<main class="board">
  <h1>Галоўны экран</h1>
  <p class="lead">Фінальны макет. Усё ў рамцы тэлефона — сам экран; перамыкачы над ім да экрана не належаць. Націск адкрывае раздзел, утрыманне дазваляе рухаць частку.</p>
</main>
<script type="module" src="menu.mjs"></script>
</body>
</html>
