<!doctype html>
<html lang="be">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KUDY — гіды</title>
<link rel="stylesheet" href="kit.css">
<style>
  /* Top bar title: the route sign from the main menu, then the city name. */
  .g-title { display: flex; align-items: center; gap: 8px; }
  .g-title .icon { color: var(--accent); }
  .g-title span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }

  /* The filter panel opens in place under the top bar and reserves the room
     for the future catalogue categories. */
  .g-filters { flex: none; margin: 0 16px 12px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .g-filters[hidden] { display: none; }
  .g-filters p { margin: 8px 0 0; }

  .g-scroll { display: flex; flex-direction: column; }
  .g-list { flex: none; display: grid; gap: 12px; margin: 0; padding: 4px 16px 16px; list-style: none; }
  .g-card { display: block; width: 100%; text-align: left; cursor: pointer; }
  .g-card:active { border-color: var(--accent); }
  .g-card > span { display: block; }
  .g-card .g-head { display: flex; align-items: center; gap: 12px; }
  .g-photo {
    flex: none;
    display: grid;
    place-items: center;
    width: 64px;
    height: 64px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--paper);
    color: var(--muted);
  }
  .g-name { flex: 1; min-width: 0; font-size: calc(20px * var(--fs)); overflow-wrap: anywhere; }
  .g-card .g-summary {
    display: -webkit-box;
    -webkit-box-orient: vertical;
    -webkit-line-clamp: 3;
    overflow: hidden;
    margin-top: 8px;
    color: var(--muted);
    overflow-wrap: anywhere;
  }
  .g-card .g-meta { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 12px; margin-top: 8px; }
  .g-langs { display: flex; flex-wrap: wrap; gap: 4px 12px; }
  .g-lang { display: inline-flex; align-items: center; gap: 6px; }
  .g-meta .tag { margin-left: auto; }

  .g-cache { display: flex; align-items: center; gap: 8px; margin: 4px 16px 12px; }
  .g-empty { margin: 8px 16px; color: var(--muted); }

  /* Free room under a short list: the engraved panorama rests on its bottom edge. */
  .g-rest { flex: none; margin-top: auto; }
  .g-ad { padding-bottom: 8px; }

  .sr { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<main class="board">
  <h1>Гіды</h1>
  <p class="lead">Спіс гідаў горада. Усё ў рамцы тэлефона — сам экран; перамыкачы над ім да экрана не належаць. Націск на картку адкрывае прэв'ю гіда: ён нічога не купляе і не пачынае прагулку.</p>
</main>
<script type="module" src="guides.mjs"></script>
</body>
</html>
