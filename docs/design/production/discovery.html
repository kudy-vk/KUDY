<!doctype html>
<html lang="be">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>KUDY — Чым заняцца</title>
<link rel="stylesheet" href="kit.css">
<style>
  .sr { position: absolute; width: 1px; height: 1px; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  /* A long title in a wide language takes a second line instead of being cut. */
  .topbar .title { white-space: normal; line-height: 1.2; overflow-wrap: anywhere; }

  .page { display: grid; align-content: start; gap: 12px; padding: 4px 16px 24px; }
  .page > * { min-width: 0; }
  .notice.row { display: flex; gap: 8px; margin: 0; font-size: calc(14px * var(--fs)); }
  .notice.row .icon { margin-top: 2px; }

  /* The selector: one row of chips per question, led by its sign. */
  .selector { display: grid; gap: 8px; padding-bottom: 4px; }
  .group { display: flex; align-items: flex-start; gap: 8px; }
  .group > .icon { margin-top: 10px; color: var(--muted); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; min-width: 0; }
  .chip { text-align: left; }

  .section { margin: 4px 0 0; font-size: calc(16px * var(--fs)); font-weight: 600; }
  .textlink {
    display: inline-flex; align-items: center; justify-self: start; gap: 4px; min-height: 48px; padding: 0;
    border: 0; background: none; color: var(--accent); font-size: calc(14px * var(--fs)); font-weight: 600; text-align: left; cursor: pointer;
  }


  /* Why a card is in the list, and how an alternative differs from the request. */
  .offer-note { display: flex; gap: 6px; margin-top: 8px; font-size: calc(13px * var(--fs)); }
  .offer-note .icon { margin-top: 1px; }
  .offer-note.reason .icon { color: var(--accent); }
</style>
</head>
<body>
<main class="board">
  <h1>Чым заняцца</h1>
  <p class="lead">Фінальны макет. Выбар часу, тэмы і сезона і спіс прапаноў пад ім: дакладныя вынікі асобна, іншыя варыянты — пад сваім загалоўкам і з названым адрозненнем. Перамыкачы над тэлефонам да экрана не належаць.</p>
</main>
<script type="module" src="discovery.mjs"></script>
</body>
</html>
